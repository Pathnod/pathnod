packages:
  - packages/*
  - apps/dashboard

engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
allowBuilds:
  blake-hash: true
  bufferutil: false
  esbuild: true
  utf-8-validate: false
overrides:
  # jayson 5 removes stream-json and uuid; keep the override scoped to web3.
  '@solana/web3.js>jayson': 5.0.0
  underscore: 1.13.8
  ws: 8.21.0
