[package]
name = "pathnod-observation-mopro"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["uniffi"]
uniffi = ["mopro-ffi/uniffi"]
wasm = []

[dependencies]
mopro-ffi = { version = "=0.3.7" }
circom-prover = "0.1"
rust-witness = "0.1"
num-bigint = "0.4"
thiserror = "2"

[build-dependencies]
rust-witness = "0.1"

[dev-dependencies]
serde_json = "1"
