name: ESP32 firmware

on:
  pull_request:
    paths:
      - 'firmware/esp32/**'
      - '.github/workflows/firmware.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/esp32/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host test dependency
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Test identity, protocol, replay protection, durable counters and hint
        run: |
          cmake -S firmware/esp32/tests -B "$RUNNER_TEMP/firmware-tests"
          cmake --build "$RUNNER_TEMP/firmware-tests"
          ctest --test-dir "$RUNNER_TEMP/firmware-tests" --output-on-failure
      - name: Test hardware quota harness verdicts without Bluetooth
        run: python3 -m unittest discover -s firmware/esp32/tests -p test_hardware_quota.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c3, esp32s3]
        profile: [development, protected, helium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile only (never flash or burn eFuses)
        shell: bash
        working-directory: firmware/esp32
        env:
          FIRMWARE_TARGET: ${{ matrix.target }}
          FIRMWARE_PROFILE: ${{ matrix.profile }}
          COLUMNS: '180'
        run: |
          set -euo pipefail
          # The container user differs from the checkout owner. Trust only this checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = fcae32885b0296b32044cb99ecbdc50d98dddb83
          defaults=sdkconfig.defaults
          if [[ "$FIRMWARE_PROFILE" == protected ]]; then
            defaults='sdkconfig.defaults;sdkconfig.protected'
          elif [[ "$FIRMWARE_PROFILE" == helium ]]; then
            defaults='sdkconfig.defaults;sdkconfig.helium'
          fi
          idf.py -B build -D SDKCONFIG=sdkconfig.ci.local \
            -D SDKCONFIG_DEFAULTS="$defaults" set-target "$FIRMWARE_TARGET"
          idf.py -B build -D SDKCONFIG=sdkconfig.ci.local build size
          idf.py -B build -D SDKCONFIG=sdkconfig.ci.local size-components > build/size-components.txt
          idf.py -B build -D SDKCONFIG=sdkconfig.ci.local size-files > build/size-files.txt
          cat build/size-components.txt >> "$GITHUB_STEP_SUMMARY"
          cat build/size-files.txt
          if [[ "$FIRMWARE_PROFILE" == protected ]]; then
            for option in PATHNOD_REQUIRE_ENCRYPTED_STORAGE SECURE_FLASH_ENC_ENABLED \
              SECURE_FLASH_REQUIRE_ALREADY_ENABLED NVS_ENCRYPTION NVS_SEC_KEY_PROTECT_USING_FLASH_ENC; do
              grep -qx "CONFIG_${option}=y" sdkconfig.ci.local
            done
          fi
          # Helium emulation is demo-only and must never leak into other profiles.
          if [[ "$FIRMWARE_PROFILE" == helium ]]; then
            grep -qx 'CONFIG_PATHNOD_HELIUM_EMULATION=y' sdkconfig.ci.local
          elif grep -q '^CONFIG_PATHNOD_HELIUM_EMULATION=y' sdkconfig.ci.local; then
            echo "::error::Helium emulation enabled outside the helium profile"
            exit 1
          fi
          test -s "dependencies.${FIRMWARE_TARGET}.lock"
          git diff --exit-code -- "dependencies.${FIRMWARE_TARGET}.lock"
      - name: Report application size budget
        shell: bash
        working-directory: firmware/esp32
        run: |
          set -euo pipefail
          size_bytes=$(stat -c %s build/pathnod_device.bin)
          echo "Application binary: ${size_bytes} bytes. DEV-22 target: < 200000 bytes (bootloader/partitions excluded)." >> "$GITHUB_STEP_SUMMARY"
          if (( size_bytes >= 200000 )); then
            echo "::warning::DEV-22 size target is not met: ${size_bytes} >= 200000 bytes. A passing build is not full DEV-22 acceptance."
          fi
