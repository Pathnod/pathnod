[package]
name = "pathnod"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Development-only Groth16 observation program"

[lib]
crate-type = ["cdylib", "lib"]
name = "pathnod"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
groth16-solana = "=0.2.0"
solana-define-syscall = "=5.2.0"
