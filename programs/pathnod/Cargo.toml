[package]
name = "pathnod"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal Pathnod Solana program; exists to validate the pinned toolchain"

[lib]
crate-type = ["cdylib", "lib"]
name = "pathnod"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
